<!DOCTYPE html>
<html>
<head>
        <meta charset="UTF-8" />
        <!-- 强制适配手机视口，禁止缩放，避免布局偏移 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <style>
                * {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                }
                html, body {
                        width: 100%;
                        height: 100%;
                        overflow: hidden; /* 禁止页面滚动，防止手势冲突 */
                        touch-action: none; /* 阻断浏览器默认触摸手势 */
                        background: #000 !important;
                }
                canvas {
                        display: block;
                        width: 100vw;
                        height: 100vh;
                }
                /* 加载提示层，解决手机端模型加载慢无反馈问题 */
                #loadingMask {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: #000;
                        color: #fff;
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        z-index: 30;
                        font-size: 16px;
                        transition: opacity 0.3s;
                }
                #loadingMask .progress {
                        margin-top: 12px;
                        width: 120px;
                        height: 4px;
                        background: rgba(255,255,255,0.2);
                        border-radius: 2px;
                        overflow: hidden;
                }
                #loadingMask .progressBar {
                        height: 100%;
                        width: 0%;
                        background: linear-gradient(90deg, #ff66b2, #8857ff);
                        transition: width 0.2s;
                }
                #mainTitle {
                        position: fixed;
                        left: 50%;
                        top: clamp(12px, 3vw, 20px);
                        transform: translateX(-50%);
                        padding: clamp(8px, 2vw, 12px) clamp(16px, 4vw, 22px);
                        border-radius: 20px;
                        background: linear-gradient(135deg, rgba(255, 102, 178, 0.95), rgba(136, 87, 255, 0.95));
                        border: 2px solid rgba(255, 255, 255, 0.45);
                        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 16px rgba(255, 146, 208, 0.45);
                        color: #fff;
                        font-size: clamp(20px, 6vw, 32px);
                        font-weight: 900;
                        letter-spacing: 1px;
                        text-align: center;
                        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
                        z-index: 15;
                        pointer-events: none;
                        /* 手机端适配安全区 */
                        padding-top: calc(clamp(8px, 2vw, 12px) + env(safe-area-inset-top));
                }
                #infoBox {
                        position: fixed;
                        left: 50%;
                        bottom: clamp(16px, 5vw, 24px);
                        transform: translateX(-50%);
                        width: min(520px, calc(100vw - 32px));
                        max-height: 40vh;
                        padding: clamp(12px, 3vw, 18px);
                        background: rgba(18, 6, 24, 0.92);
                        border: 2px solid #d98eb5;
                        border-radius: 16px;
                        color: #fff;
                        font-size: clamp(14px, 3.5vw, 16px);
                        line-height: 1.65;
                        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
                        pointer-events: none;
                        opacity: 0;
                        transition: opacity 0.25s ease;
                        z-index: 20;
                        /* 手机端安全适配 */
                        bottom: calc(clamp(16px, 5vw, 24px) + env(safe-area-inset-bottom));
                        overflow-y: auto;
                        /* 自定义滚动条 */
                        scrollbar-width: thin;
                        scrollbar-color: #d98eb5 transparent;
                }
                #infoBox::-webkit-scrollbar {
                        width: 4px;
                }
                #infoBox::-webkit-scrollbar-thumb {
                        background: #d98eb5;
                        border-radius: 2px;
                }
                #infoBox.show {
                        opacity: 1;
                }
                #infoBox .title {
                        font-size: clamp(18px, 5vw, 22px);
                        font-weight: bold;
                        color: #ffd8ea;
                        margin-bottom: 8px;
                        line-height: 1.3;
                }
                #infoText {
                        line-height: 1.6;
                        /* 强制英文和数字换行，避免溢出 */
                        word-break: break-all;
                        white-space: pre-line;
                }
        </style>
</head>
<body>
        <!-- 加载提示层 -->
        <div id="loadingMask">
                <div>脑部模型加载中</div>
                <div class="progress">
                        <div class="progressBar" id="progressBar"></div>
                </div>
        </div>

        <div id="mainTitle">🧠 奇妙的脑部探险</div>
        <div id="infoBox">
                <div class="title">脑区说明</div>
                <div id="infoText">点击模型中的部位查看说明</div>
        </div>

        <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
        <script type="module">
                import * as THREE from 'three';
                import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
                import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

                // 全局变量初始化
                let 小脑, 脑干, 大脑;
                let activeMesh = null;
                let activeHitName = '';
                let isModelLoaded = false;

                // 场景初始化
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000000);
                
                // 相机适配手机视口
                const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 5.5;

                // 渲染器性能优化适配
                const renderer = new THREE.WebGLRenderer({
                        antialias: true,
                        alpha: false,
                        powerPreference: 'high-performance', // 强制使用高性能GPU，避免发黑
                        premultipliedAlpha: true
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制像素比，平衡清晰度和性能
                renderer.setClearColor(0x000000, 1);
                document.body.appendChild(renderer.domElement);

                // 灯光适配手机端：增强环境光，减少平行光消耗，避免模型发黑
                const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(5, 8, 5);
                dirLight.intensity = 0.9;
                scene.add(dirLight);

                // 控制器适配触摸操作
                const controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true; // 开启惯性阻尼，提升滑动手感
                controls.dampingFactor = 0.08;
                controls.screenSpacePanning = false;
                controls.enableZoom = true; // 允许双指缩放
                controls.minDistance = 3.5; // 限制最小缩放距离，避免模型穿进镜头
                controls.maxDistance = 8;
                controls.rotateSpeed = 0.8; // 适配触摸旋转速度
                controls.touches = {
                        ONE: THREE.TOUCH.ROTATE, // 单指旋转
                        TWO: THREE.TOUCH.DOLLY_ZOOM // 双指缩放
                };

                // 射线检测初始化（适配触摸坐标）
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                const infoBox = document.getElementById('infoBox');
                const infoText = document.getElementById('infoText');
                const loadingMask = document.getElementById('loadingMask');
                const progressBar = document.getElementById('progressBar');

                // 模型发光效果优化（降低手机端GPU消耗）
                function setMeshGlow(mesh, enabled) {
                        if (!mesh) return;
                        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                        if (enabled) {
                                // 缩小放大比例，减少性能消耗
                                mesh.userData.__originScale = mesh.userData.__originScale || mesh.scale.clone();
                                mesh.scale.multiplyScalar(1.015);
                                materials.forEach(mat => {
                                        if (!mat || !('emissive' in mat)) return;
                                        mat.userData.__originEmissive = mat.userData.__originEmissive || mat.emissive.clone();
                                        mat.userData.__originEmissiveIntensity = mat.userData.__originEmissiveIntensity ?? mat.emissiveIntensity;
                                        // 降低发光强度，避免手机过热卡顿
                                        mat.emissiveIntensity = (mat.userData.__originEmissiveIntensity ?? 0.1) + 0.3;
                                });
                        } else {
                                if (mesh.userData.__originScale) {
                                        mesh.scale.copy(mesh.userData.__originScale);
                                }
                                materials.forEach(mat => {
                                        if (!mat || !('emissive' in mat)) return;
                                        if (mat.userData.__originEmissive) {
                                                mat.emissive.copy(mat.userData.__originEmissive);
                                        }
                                        mat.emissiveIntensity = mat.userData.__originEmissiveIntensity ?? 0.1;
                                });
                        }
                }

                // 加载GLB模型，添加加载进度反馈
                const loader = new GLTFLoader();
                loader.load('zi.glb', res => {
                        const model = res.scene;
                        // 放大模型尺寸，适配手机小屏幕
                        model.scale.set(0.25, 0.25, 0.25);
                        scene.add(model);
                        // 遍历模型子物体，获取指定脑区网格
                        model.traverse(obj => {
                                if (!obj.isMesh) return;
                                // 给所有脑区设置基础自发光，避免灯光不足时发黑
                                const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                                mats.forEach(mat => {
                                        // mat.emissive.set(0xffffff);
                                        mat.emissiveIntensity = 0.1;
                                });
                                // 匹配脑区名称
                                switch (obj.name) {
                                        case "小脑": 小脑 = obj; break;
                                        case "脑干": 脑干 = obj; break;
                                        case "大脑": 大脑 = obj; break;
                                }
                        });
                        // 模型加载完成，隐藏加载层
                        isModelLoaded = true;
                        setTimeout(() => {
                                loadingMask.style.opacity = '0';
                                setTimeout(() => {
                                        loadingMask.style.display = 'none';
                                }, 300);
                        }, 500);
                }, xhr => {
                        // 更新加载进度条
                        const percent = (xhr.loaded / xhr.total) * 100;
                        progressBar.style.width = `${percent}%`;
                }, err => {
                        // 加载失败提示
                        loadingMask.innerHTML = `<div style="color:#ff66b2">模型加载失败，请检查网络或重试</div>`;
                        console.error('模型加载失败', err);
                });

                // 触摸点击事件适配（兼容手机touchstart，解决300ms延迟）
                function handleInteraction(e) {
                        if (!isModelLoaded) return;
                        // 阻止默认事件，避免页面滚动、点击穿透
                        e.preventDefault();
                        // 兼容触摸/鼠标事件坐标计算
                        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                        if (clientX === undefined || clientY === undefined) return;
                        // 转换为Three.js标准化坐标
                        mouse.x = (clientX / window.innerWidth) * 2 - 1;
                        mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                        // 更新射线检测
                        raycaster.setFromCamera(mouse, camera);
                        const hits = [];
                        if (小脑) hits.push(...raycaster.intersectObject(小脑, true));
                        if (脑干) hits.push(...raycaster.intersectObject(脑干, true));
                        if (大脑) hits.push(...raycaster.intersectObject(大脑, true));
                        // 无命中，清空选中状态
                        if (!hits.length) {
                                setMeshGlow(activeMesh, false);
                                activeMesh = null;
                                activeHitName = '';
                                infoBox.classList.remove('show');
                                return;
                        }
                        // 获取命中网格
                        const targetMesh = hits[0].object;
                        let hitName = null;
                        if (小脑 && targetMesh === 小脑) hitName = '小脑';
                        else if (脑干 && targetMesh === 脑干) hitName = '脑干';
                        else if (大脑 && targetMesh === 大脑) hitName = '大脑';
                        if (!hitName) return;
                        // 切换发光效果
                        if (activeMesh && activeMesh !== targetMesh) setMeshGlow(activeMesh, false);
                        activeMesh = targetMesh;
                        activeHitName = hitName;
                        setMeshGlow(activeMesh, true);
                        // 更新脑区说明内容
                        let text = '';
                        switch (hitName) {
                                case '小脑':
                                        document.querySelector(".title").innerHTML = "脑区说明 —— 小脑";
                                        text = `🤸 小脑（Cerebellum）——精准的“运动协调员”
小脑位于大脑的后下方，藏在颅腔后部的窝里。虽然它的体积只有大脑的八分之一，看起来不起眼，但它的作用却非常大。在解剖图上，小脑表面也有许多平行的沟回，切面看起来像一棵树，医生们常称之为“生命之树”。小脑内部含有极其密集的神经元，数量甚至超过了大脑。它不像大脑那样分成左右对称的复杂裂片，而是呈现出一个类似蝴蝶状或绒球状的结构，紧紧贴在后脑勺下方的位置。

小脑不负责产生想法，也不负责聪明与否，它的核心任务是维持身体平衡和协调随意运动。当你在操场上奔跑、在楼道里行走，或者在单脚站立时，是小脑在悄悄工作，防止你摔倒。它还能让我们的动作变得精准和流畅。比如，我们写字时笔画的轻重、投篮时手腕的力度、弹奏乐器时手指的配合，都需要小脑的精细调节。如果小脑受伤，人走路就会摇摇晃晃（像喝醉了一样），手拿东西会发抖，动作会变得极不协调，但智力通常不会受到影响。`;
                                        break;
                                case '脑干':
                                        document.querySelector(".title").innerHTML = "脑区说明 —— 脑干";
                                        text = `❤️ 脑干（Brainstem）——不可触碰的“生命中枢”
脑干位于脑的最底部，就像一根粗壮的“管道”或“漏斗”，向下连接着脊髓，向上支撑着大脑和小脑。它虽然个头最小，却是脑最原始、最关键的部分。脑干从下往上依次分为延髓、脑桥和中脑。它的外形并不像大脑那样有复杂的沟回，而是比较光滑紧实的柱状结构。它深埋在大脑下方，是大脑、小脑与脊髓之间信息传递的必经之路，就像一座桥梁，连接着身体的各个部分。

脑干被称为“生命中枢”，因为它控制着最基本的生命活动。这些功能不需要我们的意识去指挥，是自动运行的。比如，心跳、呼吸、血压的调节中心就在脑干。即使我们在深度睡眠，脑干依然在辛苦工作，保证我们不会因为睡着而停止呼吸。此外，脑干还控制着我们的睡眠与觉醒，决定我们是清醒还是困倦。由于脑干承担着如此重要的使命，一旦它受到严重的损伤（比如剧烈的撞击），往往会立即危及生命。因此，我们时刻要注意保护头部，遵守交通规则，进行剧烈运动时佩戴头盔。`;
                                        break;
                                case '大脑':
                                        document.querySelector(".title").innerHTML = "脑区说明 —— 大脑";
                                        text = `🧠 大脑（Cerebrum）——人体的“总司令部”
大脑是脑中最庞大的一部分，差不多占了整个脑袋的80%，也是我们肉眼能看到的最外层。它最显著的特点是表面布满了像核桃壳一样的凹陷（叫“沟”）和隆起（叫“回”）。这些褶皱可不是随便长的，而是为了在单位体积里塞进更多的神经细胞。如果把大脑皮层铺平，面积大约有一张报纸那么大！大脑被一条深深的裂缝分成左右两个半球，中间由“胼胝体”连接。左边的半球通常负责逻辑、数学和语言，右边的半球则擅长美术、音乐和空间想象。

作为人体的“最高司令部”，大脑负责几乎所有的高级思维活动。首先，它是思维的器官，我们上课时的专心听讲、解数学难题、背英语单词，都是大脑在高速运转。其次，它掌管着记忆，无论是童年的趣事还是刚学的古诗，都储存在这里。此外，大脑还是感觉和运动的控制中心，我们能看到美丽的风景、听到悦耳的音乐、摸到物体的冷热，以及指挥手写字、脚走路，都依赖于大脑发出的指令。简单来说，学习、创造、性格、情绪，统统归大脑管。`;
                                        break;
                        }
                        // 替换换行符，更新说明内容
                        infoText.innerHTML = text.replace(/\n/g, '<br>');
                        infoBox.classList.add('show');
                }

                // 同时绑定touchstart和click事件，兼容不同机型
                window.addEventListener('touchstart', handleInteraction, { passive: false });
                window.addEventListener('click', handleInteraction);

                // 窗口resize适配，修复旋转/缩放后的布局偏移
                window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                });

                // 动画循环，优化性能
                function animate() {
                        requestAnimationFrame(animate);
                        controls.update();
                        renderer.render(scene, camera);
                }
                animate();
        </script>
</body>
</html>
